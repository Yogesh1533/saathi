<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Saathi</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: #02070d; color: #cdeeff;
    font: 15px "Avenir Next Condensed", system-ui, sans-serif; -webkit-app-region: drag;
  }
  .ring { width: 120px; height: 120px; margin: 0 auto 22px; border-radius: 50%;
    border: 2px solid rgba(79,216,255,.25); border-top-color: #4fd8ff;
    box-shadow: 0 0 40px rgba(79,216,255,.25); animation: spin 1.1s linear infinite; }
  p { text-align: center; margin: 0; color: rgba(205,238,255,.7); letter-spacing: .06em; }
  @keyframes spin { to { transform: rotate(1turn); } }
</style>
</head>
<body>
  <div><div class="ring"></div><p id="status">Starting Saathi</p></div>
  <script>
    const q = new URLSearchParams(location.search).get("status");
    if (q) document.getElementById("status").textContent = q;
  </script>
</body>
</html>
